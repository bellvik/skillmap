name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure deployment SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '80.71.224.204 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID1Jxf5lkldmPEdTHhKKS3QCkiQzRC9eu3aZ4jnYpOda' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build production image
        run: docker build --platform linux/amd64 --tag skillmap-skillmap:latest .

      - name: Deploy and verify
        run: |
          docker save skillmap-skillmap:latest \
            | gzip -1 \
            | ssh -i "$HOME/.ssh/id_ed25519" \
                -T \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                skillmap-deploy@80.71.224.204
