name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure deployment SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '80.71.224.204 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID1Jxf5lkldmPEdTHhKKS3QCkiQzRC9eu3aZ4jnYpOda' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build production image
        run: docker build --platform linux/amd64 --tag skillmap-skillmap:latest .

      - name: Deploy and verify
        run: |
          set -Eeuo pipefail

          archive_path="$(mktemp)"
          trap 'rm -f "$archive_path"' EXIT

          echo "Preparing compressed Docker image..."
          docker save skillmap-skillmap:latest | gzip -1 > "$archive_path"
          archive_size="$(stat -c '%s' "$archive_path")"
          if [ "$archive_size" -eq 0 ]; then
            echo "Compressed Docker image is empty." >&2
            exit 1
          fi
          echo "Compressed image size: $((archive_size / 1000000)) MB ($archive_size bytes)"

          python3 -u -c '
          import sys

          total = int(sys.argv[1])
          sent = 0
          last_reported = 0

          def report(percent):
              print(
                  f"Transfer progress: {percent}% "
                  f"({sent / 1_000_000:.1f}/{total / 1_000_000:.1f} MB)",
                  file=sys.stderr,
                  flush=True,
              )

          report(0)
          while True:
              chunk = sys.stdin.buffer.read(1024 * 1024)
              if not chunk:
                  break
              sys.stdout.buffer.write(chunk)
              sys.stdout.buffer.flush()
              sent += len(chunk)
              percent = sent * 100 // total
              if percent >= last_reported + 5 and percent < 100:
                  last_reported = percent // 5 * 5
                  report(last_reported)

          if sent != total:
              raise SystemExit(f"Archive size mismatch: sent {sent} of {total} bytes.")
          report(100)
          ' "$archive_size" < "$archive_path" \
            | ssh -i "$HOME/.ssh/id_ed25519" \
                -T \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=yes \
                skillmap-deploy@80.71.224.204
